# nathwn12 house CI - one shape, adapted to puppet.
# Required context from main protection: `build`. Keep that job name.
# Specialised steps kept: gitleaks and the payload-vs-schema conformance test.
# Scope comes from the GitHub API (fetch-depth: 1); docs-only changes skip
# steps, never the trigger, so the check still reports green.
name: ci

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a push run: it is the run that tests main.
  cancel-in-progress: ${{ github.event_name != 'push' }}

env:
  CARGO_INCREMENTAL: '0'
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Scope from the API
        id: scope
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          docs='^(.*\.md|docs/.*|LICEN[CS]E(\.md)?)$'
          files=""
          code=true
          if [ "$EVENT" = "pull_request" ]; then
            files="$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename')"
          elif [ "$EVENT" = "push" ] && [ -n "$BEFORE" ] && [ "${BEFORE//0/}" != "" ]; then
            files="$(gh api "repos/$REPO/compare/$BEFORE...$SHA" --paginate --jq '.files[].filename')"
          fi
          if [ -n "$files" ] && ! printf '%s\n' "$files" | grep -qvE "$docs"; then
            code=false
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@1.87.0
        if: steps.scope.outputs.code == 'true'
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        if: steps.scope.outputs.code == 'true'
        with:
          key: ci-1.87.0
      - name: fmt
        if: steps.scope.outputs.code == 'true'
        run: cargo fmt --all --check
      - name: clippy
        if: steps.scope.outputs.code == 'true'
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: docs-check
        if: steps.scope.outputs.code == 'true'
        run: node docs-check.mjs --strict
      - name: gitleaks
        if: steps.scope.outputs.code == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $Version = '8.24.3'
          $Url = "https://github.com/gitleaks/gitleaks/releases/download/v$Version/gitleaks_${Version}_windows_x64.zip"
          $Zip = Join-Path $env:TEMP "gitleaks_$Version.zip"
          $Dir = Join-Path $env:TEMP "gitleaks_$Version"
          Invoke-WebRequest -Uri $Url -OutFile $Zip
          if (Test-Path $Dir) { Remove-Item -Recurse -Force $Dir }
          Expand-Archive -Path $Zip -DestinationPath $Dir
          & (Join-Path $Dir 'gitleaks.exe') detect --source . --config .gitleaks.toml --redact --no-banner
      - name: check (compile, no link)
        if: steps.scope.outputs.code == 'true'
        run: cargo check --locked
      - name: conformance (payload vs own outputSchema)
        if: steps.scope.outputs.code == 'true'
        run: cargo test --release --locked --test envelope_truth
      - name: test (blocking; display-dependent tests filtered)
        if: steps.scope.outputs.code == 'true'
        run: cargo test --release --locked -- --skip shot::tests::live_
      - name: Scope
        if: always()
        shell: bash
        run: |
          echo "scope: ${{ steps.scope.outputs.code == 'true' && 'code changed - full gate ran' || 'docs-only - build skipped, check stays green' }}"

  advisory-env-dependent:
    name: advisory env-dependent suites
    if: github.event_name == 'pull_request'
    runs-on: windows-2022
    continue-on-error: true
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.87.0
        with:
          toolchain: 1.87.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: ci-1.87.0
      - name: env-dependent suites (advisory)
        env:
          PUPPET_LIVE_DESKTOP: '1'
        run: cargo test --release --locked
      - name: report
        if: always()
        shell: bash
        run: |
          echo "### Advisory env-dependent suites" >> "$GITHUB_STEP_SUMMARY"
          echo "PUPPET_LIVE_DESKTOP=1 cargo test --release --locked" >> "$GITHUB_STEP_SUMMARY"
          echo "Result: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
