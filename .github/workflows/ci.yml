# nathwn12 house CI — fast gate (<3 min): fmt, clippy, gitleaks, build+test.
name: ci
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          toolchain: 1.85.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ci-1.85.0
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: gitleaks
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $Version = '8.24.3'
          $Url = "https://github.com/gitleaks/gitleaks/releases/download/v$Version/gitleaks_${Version}_windows_x64.zip"
          $Zip = Join-Path $env:TEMP "gitleaks_$Version.zip"
          $Dir = Join-Path $env:TEMP "gitleaks_$Version"
          Invoke-WebRequest -Uri $Url -OutFile $Zip
          if (Test-Path $Dir) { Remove-Item -Recurse -Force $Dir }
          Expand-Archive -Path $Zip -DestinationPath $Dir
          & (Join-Path $Dir 'gitleaks.exe') detect --source . --config .gitleaks.toml --redact --no-banner
      - name: build
        run: cargo build --locked
      - name: test (live tests self-skip without PUPPET_LIVE_DESKTOP)
        run: cargo test --locked
