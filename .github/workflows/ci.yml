name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Check formatting
        run: cargo fmt --check
        continue-on-error: true
      - name: Clippy
        run: cargo clippy --all-targets
        continue-on-error: true
      - name: Build (release)
        run: cargo build --release
      - name: Test
        run: cargo test
