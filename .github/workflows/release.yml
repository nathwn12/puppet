# puppet release: derive the version from history, build the server binary,
# then tag and publish.
#
# Trigger: a `v*` tag push (a rerun of an existing release), or a dispatch that
# names the commit to release. NOBODY TYPES A VERSION ANY MORE: the run derives
# it from the commits since the last release (scripts/derive-release.mjs), so a
# version that disagrees with the tree can no longer be typed in and discovered
# by a human afterwards. The tag is produced by the publish job, immediately
# before the release is attached, so an untagged commit is the normal case and
# the tag always names the version the derivation proved.
#
# Two jobs share one derived version and one commit:
#   build   (windows-latest) asserts the workflow's own shape, derives the
#           version FIRST (a refusal fails in seconds, not after a build),
#           then builds + tests the crate. It ASSERTS, and never writes, the
#           version in Cargo.toml / npm/package.json / npm/engine-manifest.json:
#           a tree that disagrees with its own history is a defect to land, not
#           a number for CI to guess. After the test it closes the
#           `## [Unreleased]` changelog section into `## [X.Y.Z]` and uses that
#           section as the release body, assembles the server runtime bundle,
#           computes every hash from the REAL artifacts, and fills
#           npm/engine-manifest.json.
#   publish (ubuntu-latest) re-derives on the same commit as a provenance
#           check, skips a tag older than the current release, creates the tag,
#           creates the current release from those artifacts and publishes
#           npm over OIDC trusted publishing (no token; provenance is automatic).
#
# Verification of the PUBLISHED package (a stranger's registry install + boot) is
# deliberately NOT here: it lives in verify-published.yml, dispatched by hand,
# because it depends on npm's read-replica timing and must never be able to fail
# a release that already published. npm versions are immutable, so a red there
# could only strand the tag, never be re-run green.
#
# workflow_dispatch is the rehearsal lane: it derives the same version from the
# DISPATCHED REF's history (the branch or tag the run was started on, i.e.
# github.ref / github.sha) and runs the identical build + pre-publish cleanroom
# gate, then skips tag creation, release creation, npm publish and
# outgoing-release deletion for as long as dry_run (default true) holds. A dry
# run therefore proves the build and the gate without touching the registry,
# the Releases API or the tag namespace.
#
# The dispatch's optional `commit` input is an ASSERTION, never the checkout
# source: it is resolved to a full SHA against the fetched history and must be
# an ancestor of the dispatched ref, or the run refuses in seconds. To release
# a different commit, dispatch on a ref that contains it. (A short SHA handed
# to actions/checkout as `ref:` is neither a branch nor a tag, so the run used
# to die inside the action before any step could say why.)
#
# Action majors mirror the gladius release workflow (verified against the
# GitHub Releases API on 2026-10-17 there):
# checkout v7 (v7.0.1), setup-node v7 (v7.1.0), upload-artifact v7 (v7.0.2),
# download-artifact v8 (v8.0.2), softprops/action-gh-release v3 (v3.0.3).
# The toolchain is pinned to the MSRV floor (1.87: rust-toolchain.toml and
# Cargo.toml rust-version agree, and jpeg-encoder 0.7.1 in Cargo.lock is the
# crate that sets that floor - it declares rust-version 1.87), not to the
# action's floating tag.
name: release
on:
  push:
    tags:
      - 'v*'
  # Rehearsal lane, and the normal lane for a release that does not exist yet.
  # There is deliberately no `version` input: the version is a FUNCTION OF THE
  # HISTORY at the dispatched ref, and typing one would re-open the drift this
  # workflow exists to close.
  workflow_dispatch:
    inputs:
      commit:
        description: 'Assertion only (short SHA ok): refuse unless the dispatched ref contains this commit; empty = no assertion'
        required: false
        type: string
        default: ''
      dry_run:
        description: 'Rehearse only: skip tag creation, release creation, npm publish and outgoing-release deletion'
        required: false
        type: boolean
        default: true
concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false
jobs:
  build:
    name: derive + build server + manifest
    runs-on: windows-latest
    permissions:
      contents: read
    # The one version this run is about. publish reads it, and everything
    # downstream of the derive step reads RELEASE_TAG from $GITHUB_ENV.
    outputs:
      version: ${{ steps.derive.outputs.version }}
    steps:
      # fetch-depth: 0 and the tags are the derivation's input: without them
      # `git log base..HEAD` sees one commit and no base tag at all.
      # No `ref:`: the checkout source is the ref this run was dispatched on
      # (github.ref / github.sha), or the tag a push released. The typed
      # `commit` input never selects the tree — see the assertion below.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The lane's own shape is a gate before anything expensive: a workflow
      # edited into a vanillaless order (derive after the asserts, a version
      # writer, a tag in build) fails here in milliseconds. Runs the same
      # script a human runs locally.
      - name: assert the workflow's release invariants
        run: node scripts/check-release-workflow.mjs
      # The optional `commit` input asserts which commit the dispatch is about;
      # it never picks the checkout. Resolved to a full SHA first, then proven
      # to be an ancestor of what the dispatched ref points at, so a typo, an
      # ambiguous short SHA or a commit on another branch is refused here in
      # seconds instead of releasing a different tree than the caller meant.
      - name: assert the commit input is on the dispatched ref
        if: github.event_name == 'workflow_dispatch' && inputs.commit != ''
        shell: bash
        env:
          COMMIT_INPUT: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse HEAD)"
          want="$(git rev-parse --verify --quiet "${COMMIT_INPUT}^{commit}" || true)"
          if [ -z "$want" ]; then
            echo "::error::commit input '$COMMIT_INPUT' does not resolve to a commit in this checkout of $GITHUB_REF (head $head_sha)"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$want" "$head_sha"; then
            echo "::error::commit input '$COMMIT_INPUT' ($want) is not an ancestor of $GITHUB_REF (head $head_sha); dispatch on a ref that contains it"
            exit 1
          fi
          echo "commit input $want is on $GITHUB_REF ($head_sha)"
      # First, before any build, any assert and any provisioning: a refusal
      # (no release-worthy commit, a non-conventional subject, an empty
      # changelog, a manifest that is not the derived version) must cost
      # seconds.
      - name: derive release version
        id: derive
        shell: bash
        run: |
          set -euo pipefail
          node scripts/derive-release.mjs --json > "$RUNNER_TEMP/derive.json"
          node -e "
            const d = JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8'));
            const fs = require('fs');
            fs.appendFileSync(process.env.GITHUB_OUTPUT,
              ['version=' + d.version, 'level=' + d.level, 'base=' + d.base,
               'already_released=' + d.alreadyReleased].join('\n') + '\n');
            fs.appendFileSync(process.env.GITHUB_ENV, 'RELEASE_TAG=v' + d.version + '\n');
            console.log('derived ' + d.version + ' (' + d.level + ') from ' + d.base);
          " "$RUNNER_TEMP/derive.json"
      # The tag, when the run was started by one, must name the derived
      # version. Every version comparison below uses ${{ steps.derive.outputs.version }};
      # none of them is derived from the tag.
      - name: assert the ref names the derived version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ver = "${{ steps.derive.outputs.version }}"
          if ($ver -notmatch '^\d+\.\d+\.\d+$') { throw "derived version '$ver' is not X.Y.Z" }
          if ($env:GITHUB_EVENT_NAME -eq 'push' -and $env:GITHUB_REF_NAME -ne "v$ver") {
            throw "tag $env:GITHUB_REF_NAME does not name the derived version v$ver"
          }
          if ($env:RELEASE_TAG -ne "v$ver") { throw "RELEASE_TAG '$env:RELEASE_TAG' is not v$ver" }
          Write-Host "version $ver (ref $env:GITHUB_REF_NAME)"
      - uses: dtolnay/rust-toolchain@1.87.0
      - name: build
        run: cargo build --release --locked
      - name: test
        run: cargo test --release --locked
      # The changelog heading is produced by the run, AFTER the gate and before
      # any tag exists: a red build never closes a section. Idempotent, so a
      # rerun over an already-closed section changes nothing. The closed
      # section doubles as the release body (dist/release-notes.md), which is
      # why it is written to dist/ rather than committed: the tag names a
      # commit whose history is the proof, and a release run is not a writer of
      # repo content.
      - name: close the changelog section
        shell: bash
        run: node scripts/derive-release.mjs --changelog --notes-out dist/release-notes.md
      - name: assemble archives
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:RELEASE_TAG
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          # Runtime bundle: the server plus the licence, readme and
          # third-party notices (README.md links to THIRD-PARTY-NOTICES.md,
          # so the link must resolve inside the extracted bundle). The
          # launcher provisions this bundle from the GitHub Release on
          # first run (see npm/bin/puppet-mcp.js); no other bytes ride
          # the release.
          $stage = "dist\puppet-$tag-windows-x86_64"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          $bundleFiles = @('puppet.exe', 'LICENSE', 'README.md', 'THIRD-PARTY-NOTICES.md')
          Copy-Item target\release\puppet.exe, LICENSE, README.md, THIRD-PARTY-NOTICES.md -Destination $stage
          # Assert the stage rather than trust the copy: a bundle missing a
          # licence or a notice is the class of defect this list exists to
          # prevent, and it would otherwise ship silently.
          foreach ($f in $bundleFiles) {
            if (-not (Test-Path -LiteralPath (Join-Path $stage $f))) { throw "runtime bundle is missing $f" }
          }
          Compress-Archive -Path "$stage\*" -DestinationPath "$stage.zip" -Force
          Remove-Item -LiteralPath $stage -Recurse -Force
          $zipHash = (Get-FileHash -Algorithm SHA256 -Path "$stage.zip").Hash.ToLowerInvariant()
          "$zipHash  $(Split-Path $stage -Leaf).zip" | Out-File "$stage.zip.sha256" -Encoding ascii
          Write-Host "runtime: $zipHash"
      # The version asserts read $ver from the derivation, never from the tag or
      # an input, and they only COMPARE: a mismatch is a defect in the commit
      # this run is releasing, not a value to repair here. Only the hashes are
      # computed and written, from the artifacts this run just built.
      - name: assert versions + fill manifest from real artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:RELEASE_TAG
          $ver = "${{ steps.derive.outputs.version }}"
          if ($tag -ne "v$ver") { throw "RELEASE_TAG '$tag' is not v$ver" }
          function Get-Sha([string]$p) { return (Get-FileHash -Algorithm SHA256 -Path $p).Hash.ToLowerInvariant() }
          # One version everywhere: derivation == crate == npm package ==
          # manifest serverVersion. These are ASSERTS: nothing here writes a
          # version.
          $cargo = Get-Content Cargo.toml -Raw
          if ($cargo -notmatch '(?m)^version\s*=\s*"([^"]+)"') { throw 'cannot read crate version from Cargo.toml' }
          if ($Matches[1] -ne $ver) { throw "crate version $($Matches[1]) != derived version $ver" }
          $pkg = Get-Content npm/package.json -Raw | ConvertFrom-Json
          if ($pkg.version -ne $ver) { throw "npm package version $($pkg.version) != derived version $ver" }
          # Sole scripts-field exception: the global-install-refusal
          # preinstall/postinstall guards (no install-time download; they
          # only refuse `npm i -g`). Anything beyond those two guards
          # still fails closed.
          if ($null -ne $pkg.scripts) {
            $names = @($pkg.scripts.PSObject.Properties.Name | Sort-Object)
            if (($names -join ',') -ne 'postinstall,preinstall' -or $pkg.scripts.preinstall -notmatch 'npm_config_global' -or $pkg.scripts.postinstall -notmatch 'npm_config_global') {
              throw 'npm/package.json scripts field must hold only the global-install-refusal preinstall/postinstall guards'
            }
          }
          $man = Get-Content npm/engine-manifest.json -Raw | ConvertFrom-Json
          if ($man.serverVersion -ne $ver) { throw "manifest serverVersion $($man.serverVersion) != derived version $ver" }
          if ($man.package -ne 'puppet-mcp') { throw "manifest package $($man.package) != puppet-mcp" }
          # Fill the release-computed hashes from the real artifacts.
          $repo = 'https://github.com/nathwn12/puppet'
          $bundle = "puppet-$tag-windows-x86_64.zip"
          $server = Get-Item -LiteralPath target\release\puppet.exe
          $man.runtime.source = "$repo/releases/download/$tag"
          $man.runtime.archive.name = $bundle
          $man.runtime.archive.sha256 = Get-Sha "dist\$bundle"
          $man.runtime.archive.size = (Get-Item -LiteralPath "dist\$bundle").Length
          $man.runtime.server.sha256 = Get-Sha $server.FullName
          $man.runtime.server.size = $server.Length
          if ($man.serverVersion -ne $ver) { throw 'manifest serverVersion changed while filling hashes' }
          $man | ConvertTo-Json -Depth 8 | Out-File npm/engine-manifest.json -Encoding utf8
          Copy-Item npm/engine-manifest.json dist/engine-manifest.json
          Write-Host "manifest filled for $tag (serverVersion $ver, asserted not written)"
      # The npm-package artifact is populated HERE, after the fill above,
      # from the filled bytes — never from a stale or pre-fill copy.
      - name: stage npm package from the filled manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((Get-Content npm/engine-manifest.json -Raw) -match 'RELEASE_WORKFLOW_FILLS_THIS') { throw 'refusing to stage npm package with placeholder hashes' }
          New-Item -ItemType Directory -Path npm-stage -Force | Out-Null
          Copy-Item npm/bin npm-stage/bin -Recurse -Force
          # npm/README.md embeds assets/signature.svg and links
          # THIRD-PARTY-NOTICES.md, so both ride the tarball: a published
          # README that references a file the tarball does not contain is the
          # exact defect this stage list exists to prevent.
          Copy-Item npm/assets npm-stage/assets -Recurse -Force
          Copy-Item npm/package.json, npm/engine-manifest.json, npm/LICENSE, npm/README.md, THIRD-PARTY-NOTICES.md npm-stage/ -Force
          $stageFiles = @('package.json', 'engine-manifest.json', 'LICENSE', 'README.md', 'THIRD-PARTY-NOTICES.md', 'assets\signature.svg', 'bin\puppet-mcp.js')
          foreach ($f in $stageFiles) {
            if (-not (Test-Path -LiteralPath (Join-Path npm-stage $f))) { throw "npm package stage is missing $f" }
          }
          # Assert the other direction too: every local path the staged README
          # references must exist in the stage, so a new image or link cannot
          # ship dead. Absolute URLs and anchors are not local paths.
          $readme = Get-Content -LiteralPath npm-stage/README.md -Raw
          foreach ($m in [regex]::Matches($readme, '(?:src|href)="([^"]+)"|\]\(([^)\s]+)\)')) {
            $rel = if ($m.Groups[1].Success) { $m.Groups[1].Value } else { $m.Groups[2].Value }
            if ($rel -match '^(?:[a-z][a-z0-9+.-]*:|//|#)') { continue }
            if (-not (Test-Path -LiteralPath (Join-Path npm-stage $rel))) { throw "npm README references $rel, which the stage does not contain" }
          }
          $a = (Get-FileHash -Algorithm SHA256 -LiteralPath npm/engine-manifest.json).Hash
          $b = (Get-FileHash -Algorithm SHA256 -LiteralPath npm-stage/engine-manifest.json).Hash
          if ($a -ne $b) { throw 'staged manifest differs from the filled manifest' }
          Write-Host "npm package staged with $($stageFiles.Count) files and filled manifest $a"
      # Pre-publish clean room: install the staged package like a stranger
      # (scrubbed profile, empty caches) and prove the engine provisions and
      # the server boots. Same build job, blocking: any FAIL fails the build,
      # so publish (needs: build) can never run on a red gate.
      # --bundle feeds the gate the archive built in THIS job (dist\*.zip):
      # the GitHub Release that would serve it is created by publish, which
      # runs after this, so downloading it here can only 404. The launcher
      # still verifies the local zip's size and sha256 against the filled
      # manifest, so a wrong archive fails the gate exactly like a bad
      # download would — the check keeps its teeth.
      - name: cleanroom check (tarball install + boot)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:RELEASE_TAG
          # Re-entrancy control first: build the scrubbed world twice and
          # assert it is complete and independent both times. Cheap (~30 ms),
          # and it goes red before any install if the scratch lifecycle
          # regresses. The public-registry retry loop is untouched by this.
          node scripts/cleanroom-check.mjs --self-check
          $pack = Join-Path $env:RUNNER_TEMP 'cleanroom-packed'
          New-Item -ItemType Directory -Path $pack -Force | Out-Null
          $info = npm pack --json --pack-destination $pack ./npm-stage | Out-String
          $name = node -p "Object.values(JSON.parse(process.argv[1]))[0].filename" "$info"
          $tgz = Join-Path $pack $name
          $bundle = "dist\puppet-$tag-windows-x86_64.zip"
          if (-not (Test-Path -LiteralPath $bundle)) { throw "built archive missing: $bundle" }
          node scripts/cleanroom-check.mjs --tarball "$tgz" --bundle "$bundle"
      # Payload-vs-schema conformance on the binary THIS job built: one
      # tools/call per listed tool (diff on two identical PNGs, so the
      # bbox:null shape that once violated its own schema is proven here),
      # each structuredContent validated against its own declared
      # outputSchema. Same build job, blocking: any FAIL fails the build,
      # so publish (needs: build) can never run on a red gate.
      - name: payload conformance (built artifact)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node scripts/conformance-check.mjs --exe target\release\puppet.exe
      # Artifacts hand files to the publish job only; retention-days: 1 keeps
      # them out of the plan allowance (no public-repo exemption).
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: |
            dist/*.zip
            dist/*.zip.sha256
            dist/engine-manifest.json
            dist/release-notes.md
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@v7
        with:
          name: npm-package
          # Staged AFTER the manifest fill above, so the published bytes
          # are the filled manifest — never a pre-fill or stale copy.
          path: npm-stage/
          if-no-files-found: error
          retention-days: 1
  publish:
    name: tag + github release + npm publish
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    # The version came from the build job's derivation; the tag is built from
    # it here, never read from the environment's ref.
    env:
      RELEASE_TAG: v${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Same commit as the build job, from the same ref: the dispatch's
          # ref (or the pushed tag), never the typed input.
          fetch-depth: 0
      # Provenance check, not a second source of truth: the same commit must
      # derive the same version, or the artifacts were built for a different
      # tree than the one about to be tagged.
      - name: re-derive on the release commit
        shell: bash
        run: |
          set -euo pipefail
          node scripts/derive-release.mjs --json > "$RUNNER_TEMP/publish-derive.json"
          got="$(node -p "JSON.parse(require('fs').readFileSync(process.argv[1],'utf8')).version" "$RUNNER_TEMP/publish-derive.json")"
          if [ "$got" != "${RELEASE_TAG#v}" ]; then
            echo "::error::history at this commit implies $got, the build produced ${RELEASE_TAG#v}"
            exit 1
          fi
          echo "derivation agrees on this commit: $got"
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: npm-package
          path: npm-pkg
      # Runs AFTER the derivation (RELEASE_TAG is now derived, not typed), so a
      # stale rerun costs nothing and a fresh version is never skipped.
      - name: check stale tag
        id: release_mode
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current_release=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | select(.draft == false) | .tag_name' | sort -V | tail -n1)
          if [ -n "$current_release" ]; then
            latest=$(printf '%s\n%s\n' "$current_release" "$RELEASE_TAG" | sort -V | tail -n1)
            if [ "$latest" != "$RELEASE_TAG" ]; then
              echo "current=false" >> "$GITHUB_OUTPUT"
              echo "::warning::$RELEASE_TAG is older than the current release $current_release; skipping"
              exit 0
            fi
          fi
          echo "current=true" >> "$GITHUB_OUTPUT"
      # The tag is produced HERE, after the build gate, after the cleanroom
      # gate and after the stale check: the only way a `v*` tag can exist for
      # this commit is that everything above was green. A push made with
      # GITHUB_TOKEN does not start another workflow run, so this cannot loop;
      # on a rerun of an existing tag the tag is already at HEAD and is left
      # alone.
      - name: create the release tag
        if: steps.release_mode.outputs.current == 'true' && (github.event_name != 'workflow_dispatch' || inputs.dry_run == false)
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          if git rev-parse --verify -q "refs/tags/$RELEASE_TAG" >/dev/null; then
            have="$(git rev-list -n1 "$RELEASE_TAG")"
            if [ "$have" != "$sha" ]; then
              echo "::error::tag $RELEASE_TAG already points at $have, not at the release commit $sha"
              exit 1
            fi
            echo "tag $RELEASE_TAG already at $sha (rerun): left unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_TAG" -m "$RELEASE_TAG" "$sha"
          git push origin "refs/tags/$RELEASE_TAG"
          echo "tagged $sha as $RELEASE_TAG"
      # Irreversible step 1/3: creating the public release. Skipped only on a
      # rehearsal dispatch; the tag above is the one this attaches to, and the
      # body is the changelog section this run closed.
      - name: attach archives to the GitHub Release
        if: steps.release_mode.outputs.current == 'true' && (github.event_name != 'workflow_dispatch' || inputs.dry_run == false)
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ github.event.repository.name }} ${{ env.RELEASE_TAG }}
          body_path: dist/release-notes.md
          overwrite_files: true
          files: |
            dist/*.zip
            dist/*.zip.sha256
            dist/engine-manifest.json
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      # Trusted publishing needs npm >= 11.5.1 and Node >= 22.14.0.
      # Provenance is automatic over OIDC: no --provenance flag, no token.
      - name: assert toolchain + versions
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm --version
          node -e "const v=process.versions.node.split('.').map(Number); if (!(v[0]>22||(v[0]===22&&v[1]>=14))) { console.error('need node >= 22.14.0'); process.exit(1) }"
          node -e "const v=require('child_process').execSync('npm --version').toString().trim().split('.').map(Number); if (!(v[0]>11||(v[0]===11&&(v[1]>5||(v[1]===5&&v[2]>=1))))) { console.error('need npm >= 11.5.1'); process.exit(1) }"
          test "$(node -p "require('./npm-pkg/package.json').version")" = "${RELEASE_TAG#v}" || { echo "npm package version != derived version"; exit 1; }
          node -e "for (const f of ['./npm-pkg/package.json','./npm-pkg/engine-manifest.json','./npm-pkg/bin/puppet-mcp.js']) require('fs').accessSync(f); const p=require('./npm-pkg/package.json'); if (p.scripts!==undefined && (Object.keys(p.scripts).sort().join(',')!=='postinstall,preinstall' || !/npm_config_global/.test(p.scripts.preinstall) || !/npm_config_global/.test(p.scripts.postinstall))) { console.error('scripts field holds more than the preinstall/postinstall global-refusal guards'); process.exit(1) }; const m=require('./npm-pkg/engine-manifest.json'); if (m.package!=='puppet-mcp') { console.error('manifest names the wrong package'); process.exit(1) }; if (m.serverVersion!==p.version) { console.error('serverVersion != package version'); process.exit(1) }; for (const s of [m.runtime.archive.sha256, m.runtime.server.sha256]) if (!/^[0-9a-f]{64}$/.test(s)) { console.error('manifest still has placeholder hashes'); process.exit(1) }; console.log('npm package OK: only guard scripts, serverVersion matches, all release hashes filled')"
      - name: assert packaged manifest matches built assets
        shell: bash
        run: |
          set -euo pipefail
          # Prove what will actually be published: pack the staged
          # directory, read engine-manifest.json from the TARBALL (not the
          # working tree), and require its hashes to equal the release
          # manifest produced by this same run (dist/engine-manifest.json).
          mkdir -p "$RUNNER_TEMP/packed"
          info="$(npm pack --json --pack-destination "$RUNNER_TEMP/packed" ./npm-pkg)"
          tgz="$RUNNER_TEMP/packed/$(node -p "JSON.parse(process.argv[1])[0].filename" "$info")"
          tar -xzf "$tgz" -O package/engine-manifest.json > "$RUNNER_TEMP/packed/manifest.json"
          node -e "
            const fs = require('fs');
            const packed = JSON.parse(fs.readFileSync(process.argv[1], 'utf8'));
            const built = JSON.parse(fs.readFileSync('dist/engine-manifest.json', 'utf8'));
            for (const f of ['runtime.archive.sha256', 'runtime.server.sha256']) {
              const get = (o) => f.split('.').reduce((x, k) => (x == null ? x : x[k]), o);
              if (get(packed) !== get(built)) {
                console.error('::error::packaged manifest does not match the built assets (' + f + ': tarball ' + get(packed) + ' != release ' + get(built) + ')');
                process.exit(1);
              }
            }
            console.log('packaged manifest matches built assets: ' + built.runtime.archive.sha256.slice(0, 12) + '… / ' + built.runtime.server.sha256.slice(0, 12) + '…');
          " "$RUNNER_TEMP/packed/manifest.json"
      # Irreversible step 2/3: npm publish. Same guard: rehearsal dispatch only.
      - name: publish to npm (OIDC trusted publishing)
        id: publish_npm
        if: steps.release_mode.outputs.current == 'true' && (github.event_name != 'workflow_dispatch' || inputs.dry_run == false)
        run: |
          set -euo pipefail
          pkg=$(node -p "require('./npm-pkg/package.json').name")
          version="${RELEASE_TAG#v}"
          tag="$RELEASE_TAG"
          if grep -q "RELEASE_WORKFLOW_FILLS_THIS" ./npm-pkg/engine-manifest.json; then
            echo "::error::engine-manifest.json still contains placeholder RELEASE_WORKFLOW_FILLS_THIS"
            exit 1
          fi
          man_ver=$(node -p "require('./npm-pkg/engine-manifest.json').serverVersion")
          if [ "$man_ver" != "$version" ]; then
            echo "::error::manifest serverVersion $man_ver != derived version $version"
            exit 1
          fi
          node -e "const m=require('./npm-pkg/engine-manifest.json'); const tag=process.env.RELEASE_TAG; const src=(m.runtime&&m.runtime.source)||''; const arc=(m.runtime&&m.runtime.archive&&m.runtime.archive.name)||''; if(!src.includes(tag)||!arc.includes(tag)){ console.error('::error::manifest runtime.source/archive do not name tag '+tag+': '+src+' / '+arc); process.exit(1); } console.log('manifest OK: serverVersion '+m.serverVersion+', runtime '+src+' / '+arc)"
          if npm view "$pkg@$version" version >/dev/null 2>&1; then
            published="$(npm view "$pkg@$version" version)"
            tarball="$(npm view "$pkg@$version" dist.tarball)"
            echo "$pkg@$version already published (registry reports $published): $tarball; skipping npm publish"
            exit 0
          fi
          npm publish ./npm-pkg
          published_ok=0
          for i in $(seq 1 4); do
            if npm view "$pkg@$version" version >/dev/null 2>&1; then published_ok=1; break; fi
            sleep 10
          done
          if [ "$published_ok" -eq 1 ]; then
            echo "verified: $pkg@$version is resolvable"
            npm view "$pkg@$version" dist.tarball dist.integrity
          else
            echo "::warning::$pkg@$version uploaded but still in npm validation after 40 seconds; treating as published"
          fi
