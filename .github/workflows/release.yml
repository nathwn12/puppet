# puppet release: build the server binary, publish npm.
#
# Trigger: owner pushes a `v*` tag. Two jobs share one tag and one commit:
#   build   (windows-latest) builds + tests the crate, assembles the server
#           runtime bundle, computes every hash from the REAL artifacts, and
#           fills npm/engine-manifest.json.
#   publish (ubuntu-latest) creates the current release, attaches those
#           artifacts, publishes npm over OIDC trusted publishing (no
#           token; provenance is automatic), deletes the outgoing
#           release, and skips a tag older than the current release.
#
# Action majors mirror the gladius release workflow (verified against the
# GitHub Releases API on 2026-10-17 there):
# checkout v7 (v7.0.1), setup-node v7 (v7.1.0), upload-artifact v7 (v7.0.2),
# download-artifact v8 (v8.0.2), softprops/action-gh-release v3 (v3.0.3).
# The toolchain is pinned to the MSRV floor (1.85: rust-toolchain.toml,
# Cargo.toml rust-version, and hashbrown 0.17.1 / indexmap 2.14.2 in
# Cargo.lock all agree on 1.85), not to the action's floating tag.
name: release
on:
  push:
    tags:
      - 'v*'
concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false
jobs:
  build:
    name: build server + manifest
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.85.0
      - name: build
        run: cargo build --release --locked
      - name: test
        run: cargo test --release --locked
      - name: assemble archives
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:GITHUB_REF_NAME
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          # Runtime bundle: the server plus the licence + readme. The
          # launcher provisions this bundle from the GitHub Release on
          # first run (see npm/bin/puppet-mcp.js); no other bytes ride
          # the release.
          $stage = "dist\puppet-$tag-windows-x86_64"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item target\release\puppet.exe, LICENSE, README.md -Destination $stage
          Compress-Archive -Path "$stage\*" -DestinationPath "$stage.zip" -Force
          Remove-Item -LiteralPath $stage -Recurse -Force
          $zipHash = (Get-FileHash -Algorithm SHA256 -Path "$stage.zip").Hash.ToLowerInvariant()
          "$zipHash  $(Split-Path $stage -Leaf).zip" | Out-File "$stage.zip.sha256" -Encoding ascii
          Write-Host "runtime: $zipHash"
      - name: assert versions + fill manifest from real artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:GITHUB_REF_NAME
          if (-not $tag.StartsWith('v')) { throw "tag '$tag' does not start with v" }
          $ver = $tag.Substring(1)
          function Get-Sha([string]$p) { return (Get-FileHash -Algorithm SHA256 -Path $p).Hash.ToLowerInvariant() }
          # One version everywhere: tag == crate == npm package == manifest serverVersion.
          $cargo = Get-Content Cargo.toml -Raw
          if ($cargo -notmatch '(?m)^version\s*=\s*"([^"]+)"') { throw 'cannot read crate version from Cargo.toml' }
          if ($Matches[1] -ne $ver) { throw "crate version $($Matches[1]) != tag version $ver" }
          $pkg = Get-Content npm/package.json -Raw | ConvertFrom-Json
          if ($pkg.version -ne $ver) { throw "npm package version $($pkg.version) != tag version $ver" }
          # Sole scripts-field exception: the global-install-refusal
          # preinstall/postinstall guards (no install-time download; they
          # only refuse `npm i -g`). Anything beyond those two guards
          # still fails closed.
          if ($null -ne $pkg.scripts) {
            $names = @($pkg.scripts.PSObject.Properties.Name | Sort-Object)
            if (($names -join ',') -ne 'postinstall,preinstall' -or $pkg.scripts.preinstall -notmatch 'npm_config_global' -or $pkg.scripts.postinstall -notmatch 'npm_config_global') {
              throw 'npm/package.json scripts field must hold only the global-install-refusal preinstall/postinstall guards'
            }
          }
          $man = Get-Content npm/engine-manifest.json -Raw | ConvertFrom-Json
          if ($man.serverVersion -ne $ver) { throw "manifest serverVersion $($man.serverVersion) != tag version $ver" }
          if ($man.package -ne 'puppet-mcp') { throw "manifest package $($man.package) != puppet-mcp" }
          # Fill the release-computed hashes from the real artifacts.
          $repo = 'https://github.com/nathwn12/puppet'
          $bundle = "puppet-$tag-windows-x86_64.zip"
          $server = Get-Item -LiteralPath target\release\puppet.exe
          $man.runtime.source = "$repo/releases/download/$tag"
          $man.runtime.archive.name = $bundle
          $man.runtime.archive.sha256 = Get-Sha "dist\$bundle"
          $man.runtime.archive.size = (Get-Item -LiteralPath "dist\$bundle").Length
          $man.runtime.server.sha256 = Get-Sha $server.FullName
          $man.runtime.server.size = $server.Length
          $man | ConvertTo-Json -Depth 8 | Out-File npm/engine-manifest.json -Encoding utf8
          Copy-Item npm/engine-manifest.json dist/engine-manifest.json
          Write-Host "manifest filled for $tag"
      # Artifacts hand files to the publish job only; retention-days: 1 keeps
      # them out of the plan allowance (no public-repo exemption).
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: |
            dist/*.zip
            dist/*.zip.sha256
            dist/engine-manifest.json
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@v7
        with:
          name: npm-package
          path: npm/
          if-no-files-found: error
          retention-days: 1
  publish:
    name: github release + npm publish
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: npm-package
          path: npm-pkg
      - name: check stale tag
        id: release_mode
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current_release=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | select(.draft == false) | .tag_name' | sort -V | tail -n1)
          if [ -n "$current_release" ]; then
            latest=$(printf '%s\n%s\n' "$current_release" "$GITHUB_REF_NAME" | sort -V | tail -n1)
            if [ "$latest" != "$GITHUB_REF_NAME" ]; then
              echo "current=false" >> "$GITHUB_OUTPUT"
              echo "::warning::$GITHUB_REF_NAME is older than the current release $current_release; skipping"
              exit 0
            fi
          fi
          echo "current=true" >> "$GITHUB_OUTPUT"
      - name: attach archives to the GitHub Release
        if: steps.release_mode.outputs.current == 'true'
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.event.repository.name }} ${{ github.ref_name }}
          body: |
            Release ${{ github.ref_name }}. See the repository CHANGELOG and the npm package for details.
          overwrite_files: true
          files: |
            dist/*.zip
            dist/*.zip.sha256
            dist/engine-manifest.json
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      # Trusted publishing needs npm >= 11.5.1 and Node >= 22.14.0.
      # Provenance is automatic over OIDC: no --provenance flag, no token.
      - name: assert toolchain + versions
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm --version
          node -e "const v=process.versions.node.split('.').map(Number); if (!(v[0]>22||(v[0]===22&&v[1]>=14))) { console.error('need node >= 22.14.0'); process.exit(1) }"
          node -e "const v=require('child_process').execSync('npm --version').toString().trim().split('.').map(Number); if (!(v[0]>11||(v[0]===11&&(v[1]>5||(v[1]===5&&v[2]>=1))))) { console.error('need npm >= 11.5.1'); process.exit(1) }"
          test "$(node -p "require('./npm-pkg/package.json').version")" = "${GITHUB_REF_NAME#v}" || { echo "npm package version != tag version"; exit 1; }
          node -e "for (const f of ['./npm-pkg/package.json','./npm-pkg/engine-manifest.json','./npm-pkg/bin/puppet-mcp.js']) require('fs').accessSync(f); const p=require('./npm-pkg/package.json'); if (p.scripts!==undefined && (Object.keys(p.scripts).sort().join(',')!=='postinstall,preinstall' || !/npm_config_global/.test(p.scripts.preinstall) || !/npm_config_global/.test(p.scripts.postinstall))) { console.error('scripts field holds more than the preinstall/postinstall global-refusal guards'); process.exit(1) }; const m=require('./npm-pkg/engine-manifest.json'); if (m.package!=='puppet-mcp') { console.error('manifest names the wrong package'); process.exit(1) }; if (m.serverVersion!==p.version) { console.error('serverVersion != package version'); process.exit(1) }; for (const s of [m.runtime.archive.sha256, m.runtime.server.sha256]) if (!/^[0-9a-f]{64}$/.test(s)) { console.error('manifest still has placeholder hashes'); process.exit(1) }; console.log('npm package OK: only guard scripts, serverVersion matches, all release hashes filled')"
      - name: publish to npm (OIDC trusted publishing)
        id: publish_npm
        if: steps.release_mode.outputs.current == 'true'
        run: |
          set -euo pipefail
          pkg=$(node -p "require('./npm-pkg/package.json').name")
          version="${GITHUB_REF_NAME#v}"
          tag="$GITHUB_REF_NAME"
          if grep -q "RELEASE_WORKFLOW_FILLS_THIS" ./npm-pkg/engine-manifest.json; then
            echo "::error::engine-manifest.json still contains placeholder RELEASE_WORKFLOW_FILLS_THIS"
            exit 1
          fi
          man_ver=$(node -p "require('./npm-pkg/engine-manifest.json').serverVersion")
          if [ "$man_ver" != "$version" ]; then
            echo "::error::manifest serverVersion $man_ver != tag version $version"
            exit 1
          fi
          node -e "const m=require('./npm-pkg/engine-manifest.json'); const tag=process.env.GITHUB_REF_NAME; const src=(m.runtime&&m.runtime.source)||''; const arc=(m.runtime&&m.runtime.archive&&m.runtime.archive.name)||''; if(!src.includes(tag)||!arc.includes(tag)){ console.error('::error::manifest runtime.source/archive do not name tag '+tag+': '+src+' / '+arc); process.exit(1); } console.log('manifest OK: serverVersion '+m.serverVersion+', runtime '+src+' / '+arc)"
          if npm view "$pkg@$version" version >/dev/null 2>&1; then
            published="$(npm view "$pkg@$version" version)"
            tarball="$(npm view "$pkg@$version" dist.tarball)"
            echo "$pkg@$version already published (registry reports $published): $tarball; skipping npm publish"
            exit 0
          fi
          npm publish ./npm-pkg
          npm view "$pkg@$version" version >/dev/null 2>&1 || { echo "::error::npm publish did not land $pkg@$version"; exit 1; }
          echo "published $pkg@$version: $(npm view "$pkg@$version" dist.tarball) integrity $(npm view "$pkg@$version" dist.integrity)"
      - name: delete outgoing releases
        if: always() && steps.release_mode.outputs.current == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "current release $GITHUB_REF_NAME is missing; keeping outgoing releases"
            exit 0
          fi
          pkg=$(node -p "require('./npm-pkg/package.json').name")
          version="${GITHUB_REF_NAME#v}"
          if [ "${{ steps.publish_npm.outcome }}" != "success" ] && ! npm view "$pkg@$version" version >/dev/null 2>&1; then
            echo "$pkg@$version is not live; keeping outgoing releases"
            exit 0
          fi
          # One pinned release per repo: delete every other published release (tags stay).
          # The current release was created above; npm publish has succeeded.
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | select(.draft == false) | .tag_name' |
            while read -r tag; do
              if [ "$tag" = "$GITHUB_REF_NAME" ]; then continue; fi
              gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag=false
            done
