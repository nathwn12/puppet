[package]
name = "puppet"
version = "4.4.0"
edition = "2021"
license = "MIT"
description = "Native-Rust Windows desktop-control MCP server over stdio: screenshot, windows, input, cursor."
repository = "https://github.com/nathwn12/puppet"
keywords = ["mcp", "windows", "automation", "desktop", "screenshot"]
categories = ["command-line-utilities"]
rust-version = "1.80"

[dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_Storage_Xps",
  "Win32_System_Com",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_StationsAndDesktops",
  "Win32_System_Threading",
  "Win32_UI_Accessibility",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }
serde_json = { version = "1", features = ["preserve_order"] }
png = "0.17"
jpeg-encoder = "0.6"
base64 = "0.22"
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
] }

# ---------------------------------------------------------------- build speed
# Fast inner loop. `line-tables-only` keeps file:line backtraces but drops
# variable/type debuginfo. Measured (MSVC, this toolchain): dev PDB 11.7 ->
# 6.1 MB (-48.0 %); dev target dir 170 -> 142 MB. Wall-clock effect: none
# measurable - this is a disk/I-O/staging win.
[profile.dev]
debug = "line-tables-only"   # MSRV 1.71 for string values
incremental = true           # already the default; stated so nobody "optimises" it away
opt-level = 0                # already the default; keep it

# `test` inherits `dev`, so `cargo test` gets the same treatment.
[profile.test]
inherits = "dev"

# No [profile.release] block: the release defaults are already the
# build-time-friendly set (opt-level=3, codegen-units=16, lto=false,
# panic="unwind", debug=false, strip="none").
